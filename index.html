
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025 金发科技信息管理部年度颁奖盛典</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Floating Animation */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .animate-float {
            animation: float 5s ease-in-out infinite;
        }

        /* Waving Animation */
        .animate-wave {
            animation: wave 2s infinite;
            transform-origin: 70% 70%;
        }
        @keyframes wave {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-20deg); }
            50% { transform: rotate(10deg); }
            75% { transform: rotate(-10deg); }
            100% { transform: rotate(0deg); }
        }

        /* Background Dynamics */
        .red-gradient {
            background: radial-gradient(circle at center, #9f1239 0%, #450a0a 100%);
            position: relative;
            overflow: hidden;
        }
        .bg-particle {
            position: absolute;
            bottom: -20px;
            background: rgba(255, 215, 0, 0.4);
            border-radius: 50%;
            pointer-events: none;
            animation: rise 10s infinite linear;
            filter: blur(2px);
        }
        @keyframes rise {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-120vh) scale(1.5); opacity: 0; }
        }

        /* Award Card */
        .award-card {
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: rgba(69, 10, 10, 0.4);
        }
        .award-card.active {
            transform: scale(1.05);
            /* z-index handling moved to component logic or kept simple */
            z-index: 20;
        }

        /* Speech Bubble */
        .speech-bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 10px 20px;
            color: #7f1d1d;
            font-size: 14px;
            font-weight: 800;
            white-space: nowrap;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            opacity: 0;
            transform: translateY(20px) scale(0.8);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        .speech-bubble.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Robot Sign */
        .robot-sign {
            transform-origin: bottom center;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .robot-sign.hidden-sign {
            transform: scale(0);
        }
        .robot-sign.visible-sign {
            transform: scale(1);
        }
        
        /* Modal Animation */
        .modal-enter {
            animation: modalPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.8) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* New Animations */
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            60% { transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes glowPulse {
            0% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.2); border-color: rgba(251, 191, 36, 0.5); }
            50% { box-shadow: 0 0 50px rgba(251, 191, 36, 0.6); border-color: rgba(251, 191, 36, 1); }
            100% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.2); border-color: rgba(251, 191, 36, 0.5); }
        }

        .animate-pop-in {
            animation: popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .animate-glow-pulse {
            animation: glowPulse 2s infinite ease-in-out;
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #fbbf24;
            border-radius: 2px;
        }
    </style>
